name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # Locally hererocks runs through uvx; here it is installed directly.
  HEREROCKS: hererocks

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install hererocks
        run: pip install hererocks

      - name: Install stylua
        run: cargo install stylua

      - name: Install Lua toolchain and dependencies
        run: make deps

      - name: Verify
        run: make verify
