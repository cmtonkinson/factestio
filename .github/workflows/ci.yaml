name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # Locally hererocks runs through uvx; here it is installed directly.
  HEREROCKS: hererocks

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install hererocks
        run: pip install hererocks

      # stylua gates syntax variants behind cargo features, and the default set
      # omits lua52 -- without it stylua.toml's `syntax = "Lua52"` is rejected.
      # Homebrew builds with --all-features, which is why this only bites in CI.
      - name: Install stylua
        run: cargo install stylua --features lua52

      - name: Install Lua toolchain and dependencies
        run: make deps

      - name: Verify
        run: make verify
