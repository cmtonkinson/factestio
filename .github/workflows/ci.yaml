name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # Locally hererocks runs through uvx; here it is installed directly.
  HEREROCKS: hererocks

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install hererocks
        run: pip install hererocks

      # The default cargo feature set omits lua52, which stylua.toml's
      # `syntax = "Lua52"` requires.
      - name: Install stylua
        run: cargo install stylua --features lua52

      - name: Install Lua toolchain and dependencies
        run: make deps

      # Same order as `make verify`: static checks before running any code.
      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  # Runs factestio against a real headless Factorio; see scripts/smoke.sh.
  smoke:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install hererocks
        run: pip install hererocks

      - name: Smoke test
        run: scripts/smoke.sh
